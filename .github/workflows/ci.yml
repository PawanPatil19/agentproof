name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Receipt vectors verify without TypeScript
        run: python3 docs/spec/verify_vectors.py
      - name: Demo runs end to end
        run: npm run demo
      - name: Benchmark (A07 target p95 ≤ 100 ms)
        run: npm run bench
